[project]
name = "autograder"
version = "1.0.0"
description = "General-purpose grading engine with an HTTP service and a GitHub Action host."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# One supported interpreter for the engine, the service, the Action and CI.
requires-python = "==3.13.*"
# The engine, its execution host and the GitHub Action.
dependencies = [
    "ast-grep-py~=0.51.1",
    "beautifulsoup4~=4.13.4",
    "boto3~=1.43",
    "docker~=7.1.0",
    "openai==1.93.0",
    "pydantic~=2.12.5",
    # Imported directly for PydanticCustomError; pydantic pins the exact version.
    "pydantic-core",
    "pyyaml~=6.0.2",
    "requests~=2.32.4",
]

[project.optional-dependencies]
# The private sandbox control API (sandbox_manager.api): the sandbox manager image.
sandbox = [
    # Imported directly by the sandbox control API (its acquisition capacity limiter).
    "anyio~=4.16",
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
]
# The HTTP service (web/), which can also host the sandboxes in-process: the API image.
server = [
    "autograder[sandbox]",
    "aiosqlite~=0.20.0",
    "alembic~=1.13.0",
    "asyncpg~=0.30",
    "sqlalchemy[asyncio]~=2.0.0",
]

[dependency-groups]
test = [
    "hatchling~=1.27",
    "httpx~=0.28.0",
    "pytest~=8.4.1",
    "pytest-asyncio~=0.25.0",
    "pytest-cov~=7.0",
]
lint = ["pylint~=4.0"]
docs = [
    "mkdocs~=1.6",
    "mkdocs-material~=9.6",
    "mkdocs-redirects==1.2.2",
    "pymdown-extensions~=10.0",
]
# `uv sync` installs this group by default: a complete development environment.
dev = [
    "autograder[server]",
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autograder", "execution_host", "github_action", "sandbox_manager", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import their helpers (`tests.*`) and the runnable examples
# (`examples.*`) from the checkout, without PYTHONPATH.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
