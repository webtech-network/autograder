<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My favourite books</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My favourite books</h1>
  </header>
  <main>
    <section class="books">
      <article class="book">
        <img src="dune.jpg" alt="Cover of Dune">
        <h2>Dune</h2>

      <article class="book">
        <img src="emma.jpg" alt="Cover of Emma">

    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
