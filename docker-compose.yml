# DEVELOPMENT STACK ONLY. It shows the supported topology (an API in remote mode
# and a private sandbox manager) with throwaway credentials, an S3 emulator and
# no TLS. Production configuration and its persistent state are described in
# docs/operate/deployment.md; every variable is in docs/operate/configuration.md.
#
#   export SANDBOX_API_TOKEN=... AUTOGRADER_INTEGRATION_TOKEN=...   # long random secrets
#   make start-autograder                                           # http://127.0.0.1:8000
#
# Any number of stacks can run side by side under different project names
# (`docker compose -p <name>`): nothing here has a fixed container name, and the
# API's published port is AUTOGRADER_HTTP_PORT (default 8000; empty picks a free
# port, see `docker compose port api 8000`). `make test-http` starts two this way
# from empty volumes. `docker compose down -v` deletes a stack's data.

# The default project name; `-p <name>` (or COMPOSE_PROJECT_NAME) starts another stack.
name: autograder

x-database-url: &database-url postgresql+asyncpg://autograder:development-only@postgres:5432/autograder

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autograder
      POSTGRES_PASSWORD: development-only
      POSTGRES_DB: autograder
    # No published port: use `docker compose exec postgres psql -U autograder`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autograder']
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot schema migration. The API never creates tables and refuses to start
  # unless the database is at the revision its image was built for.
  migrate:
    image: autograder-api:${AUTOGRADER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ['alembic', '-c', 'web/alembic.ini', 'upgrade', 'head']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One-shot: create the fixture bucket and upload examples/fixtures (idempotent).
  storage-init:
    image: autograder-api:${AUTOGRADER_IMAGE_TAG:-local}
    command: ['python', '/seed/seed_fixture_store.py', '/seed/objects']
    environment:
      EXTERNAL_ASSETS_BUCKET_NAME: autograder-assets
      S3_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    volumes:
      - ./scripts/seed_fixture_store.py:/seed/seed_fixture_store.py:ro
      - ./examples/fixtures:/seed/objects:ro
    depends_on:
      ministack:
        condition: service_started
    restart: 'no'

  api:
    image: autograder-api:${AUTOGRADER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: *database-url
      AUTOGRADER_INTEGRATION_TOKEN: ${AUTOGRADER_INTEGRATION_TOKEN:?Set AUTOGRADER_INTEGRATION_TOKEN to a long random secret}
      SANDBOX_MODE: remote
      SANDBOX_API_URL: http://sandbox-manager:8001
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:?Set SANDBOX_API_TOKEN to a long random secret}
      EXTERNAL_ASSETS_BUCKET_NAME: autograder-assets
      S3_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '127.0.0.1:${AUTOGRADER_HTTP_PORT-8000}:8000'
    volumes:
      # Finalized outcomes not yet in the database (WEB_OUTCOME_RECEIPT_DIR, relative
      # to /app). They must survive a recreated container, or it grades again.
      - receipts:/app/data/unpublished-outcomes
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      sandbox-manager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/ready']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Private sandbox control API: reachable only on this project's network
  # (expose, never ports) and only with the bearer token. It alone holds the
  # Docker socket.
  sandbox-manager:
    image: autograder-sandbox-manager:${AUTOGRADER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    # A hostname unique to the project and stable across restarts: a restarted
    # manager reclaims its dead predecessor's sandboxes (owner lease) and never
    # another stack's. Run exactly one replica.
    hostname: ${COMPOSE_PROJECT_NAME}-sandbox-manager
    environment:
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:?Set SANDBOX_API_TOKEN to a long random secret}
    expose:
      - '8001'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8001/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # S3 emulator for fixtures; reachable only on this project's network.
  ministack:
    image: ministackorg/ministack:1.3
    environment:
      - GATEWAY_PORT=4566
      - MINISTACK_HOST=ministack
      - MINISTACK_REGION=us-east-1
      - PERSIST_STATE=1
      - S3_PERSIST=1
      - S3_DATA_DIR=/data/s3
      - STATE_DIR=/data/state
      - LOG_LEVEL=INFO
    volumes:
      - ministack_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  ministack_data:
  receipts:
