site_name: Autograder Documentation
site_description:
  Educational-standards-driven autograding platform documentation
site_url: https://webtech-network.github.io/autograder/
repo_url: https://github.com/webtech-network/autograder
repo_name: webtech-network/autograder
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  # Addresses of pages that were merged or removed land on the page that now
  # holds their content (tests/unit/test_documentation.py checks every target).
  - redirects:
      redirect_maps:
        getting-started/mkdocs-local-development.md: getting-started/first-grading-workflow.md
        core/pipeline-architecture.md: architecture/overview.md
        core/criteria-tree.md: author/scoring.md
        core/sandbox-management.md: contracts/SANDBOX.md
        core/template-library.md: reference/evaluators.md
        core/feedback-generation.md: author/feedback.md
        pipeline/README.md: architecture/overview.md
        pipeline/01-load-template.md: architecture/overview.md
        pipeline/02-build-tree.md: architecture/overview.md
        pipeline/03-sandbox.md: contracts/CAPABILITIES.md
        pipeline/04-pre-flight.md: author/preparation.md
        pipeline/04.5-ai-batch.md: contracts/CAPABILITIES.md
        pipeline/04.8-structural-analysis.md: contracts/FILES.md
        pipeline/05-grade.md: author/scoring.md
        pipeline/06-focus.md: author/feedback.md
        pipeline/07-feedback.md: author/feedback.md
        pipeline/08-export.md: contracts/OUTCOMES.md
        features/grading_engine.md: author/scoring.md
        features/focus_feature.md: author/feedback.md
        features/score_vector.md: author/results.md
        features/baseline_comparison.md: contracts/COMPARISON.md
        features/deliberate_code_execution.md: contracts/EXECUTION.md
        features/setup_config_feature.md: author/preparation.md
        features/program_commands.md: author/preparation.md
        features/localization.md: author/feedback.md
        template-library/input_output.md: reference/evaluators.md
        template-library/api_testing.md: reference/evaluators.md
        template-library/web_dev.md: reference/evaluators.md
        template-library/static_analysis.md: reference/evaluators.md
        guides/github_module.md: github_action/README.md
        guides/criteria_configuration_examples.md: author/tutorial.md
        guides/criteria-tree-educational-standards.md: author/scoring.md
        architecture/core_structures.md: architecture/overview.md
        architecture/pipeline_execution_tracking.md: architecture/overview.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Author:
      - "Tutorial: Your First Assignments": author/tutorial.md
      - Scores, Bonus and Penalty: author/scoring.md
      - Languages, Files and Setup: author/preparation.md
      - Student Feedback: author/feedback.md
      - Test Your Rubric: author/testing.md
      - Read a Result: author/results.md
      - Evaluator Reference: reference/evaluators.md
      - Definition Reference: reference/definition.md
  - Integrate:
      - Run the HTTP Service: getting-started/first-grading-workflow.md
      - REST API: API.md
      - Executable Examples: contracts/CONFORMANCE.md
      - HTTP Trust Boundary: contracts/AUTH.md
      - Replay Safety: contracts/REPLAY.md
      - Submission Input: contracts/SUBMISSIONS.md
      - Evaluator Files: contracts/FILES.md
      - Definitions: contracts/DEFINITIONS.md
      - Languages and Runtimes: contracts/LANGUAGES.md
      - Outcomes: contracts/OUTCOMES.md
      - Baseline Comparison: contracts/COMPARISON.md
      - Deliberate Execution: contracts/EXECUTION.md
      - Durable Jobs: contracts/JOBS.md
      - Catalog and Python API: contracts/CATALOG.md
      - GitHub Action:
          - Overview: github_action/README.md
          - Quick Start: github_action/quick-start.md
          - Configuration Reference: github_action/configuration.md
          - Cloud Publication: github_action/external-mode.md
          - Identity and Trust: github_action/trust.md
          - Cloud Publication Rollout: guides/external-mode-rollout.md
      - Decisions and Migration Notes: contracts/DECISIONS.md
  - Extend:
      - Adding an Evaluator: architecture/extending.md
      - Responsibilities and Dependencies: architecture/overview.md
      - Host Capabilities: contracts/CAPABILITIES.md
      - Process Contract: contracts/PROCESSES.md
  - Operate and Contribute:
      - Deploying the HTTP Service: operate/deployment.md
      - Configuration Reference: operate/configuration.md
      - Sandbox Ownership: contracts/SANDBOX.md
      - Development Guide: guides/development.md
      - Sandbox Manager Internals: architecture/sandbox_manager.md
      - Web Module: architecture/web_module.md
