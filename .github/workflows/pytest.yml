name: Pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autograder
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: autograder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autograder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://autograder:local-test-only@127.0.0.1:5432/autograder

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup environment
        run: |
          echo "PYTHONPATH=." >> $GITHUB_ENV

      - name: Check generated contracts
        run: python scripts/generate_contract_schemas.py --check

      - name: Build sandbox images
        run: |
          make sandbox-build-all

      - name: Execute unit tests
        run: |
          make test

      - name: Execute web API contract tests
        run: |
          pytest tests/web/

      - name: Execute integration tests
        run: |
          make test-integration

      - name: Execute E2E tests
        run: |
          make test-e2e
