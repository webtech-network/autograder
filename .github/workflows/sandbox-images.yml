name: Sandbox runtime images

# Builds every runtime image in sandbox_manager/images from scratch, checks its
# contents, runs the Docker integration suite (including the golden outcomes)
# against exactly those images, and on main publishes the references that the
# registry does not have yet. Published references are never overwritten.

on:
  pull_request:
    paths:
      - "sandbox_manager/**"
      - "scripts/sandbox_images.py"
      - "sandbox_config.yml"
      - "tests/integration/**"
      - ".github/workflows/sandbox-images.yml"
  push:
    branches: [main]
    paths:
      - "sandbox_manager/images/**"
      - "scripts/sandbox_images.py"
      - "sandbox_config.yml"
      - ".github/workflows/sandbox-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build every runtime image from scratch
        run: python scripts/sandbox_images.py build --no-cache

      # Includes the image-content checks (tests/integration/test_runtime_images.py).
      - name: Integration suite and golden outcomes against these images
        env:
          PYTHONPATH: .
        run: python -m pytest tests/integration/

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish new references
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/sandbox_images.py publish
