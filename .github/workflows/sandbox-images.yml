name: Sandbox runtime images

# Builds every runtime image in sandbox_manager/images from scratch, checks its
# contents, runs the Docker integration suite (including the golden outcomes)
# against exactly those images, and on main publishes the references that the
# registry does not have yet. Published references are never overwritten.

on:
  pull_request:
    paths:
      - "sandbox_manager/**"
      - "scripts/sandbox_images.py"
      - "sandbox_config.yml"
      - "tests/integration/**"
      - ".github/workflows/sandbox-images.yml"
  push:
    branches: [main]
    paths:
      - "sandbox_manager/images/**"
      - "scripts/sandbox_images.py"
      - "sandbox_config.yml"
      - ".github/workflows/sandbox-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install

      - name: Build every runtime image from scratch
        run: uv run --locked python scripts/sandbox_images.py build --no-cache

      # Includes the image-content checks (tests/integration/test_runtime_images.py).
      - name: Integration suite and golden outcomes against these images
        run: uv run --locked python -m pytest tests/integration/

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish new references
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: uv run --locked python scripts/sandbox_images.py publish
