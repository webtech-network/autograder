# One workflow verifies every commit and is the only path to production.
#
# Each verification job runs Makefile targets only, exactly as contributors do
# (see docs/guides/development.md). `deploy` needs every other job, so a commit
# deploys only after all of its verification succeeded; a test enforces that new
# jobs join `deploy.needs`.
#
# Third-party actions are pinned to release commits (the tag is in the comment).
name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its superseded run; every commit on
  # main gets its own group, so main runs (and their deploys) are never cancelled.
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    name: Core path (make verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
          cache: pip
      - run: make install
      - run: make verify

  postgres:
    name: PostgreSQL tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autograder
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: autograder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autograder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://autograder:local-test-only@127.0.0.1:5432/autograder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
          cache: pip
      - run: make install
      - run: make test-postgres

  images:
    name: Service and Action images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: make images

  docker:
    name: Docker sandboxes (integration and e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
          cache: pip
      - run: make install
      - run: make test-integration
      - run: make test-e2e

  # The HTTP path (compose stack from this commit: PostgreSQL, migrations,
  # remote mode, smoke and e2e) and the packaged Action path join here as their
  # own jobs, each running one make target, and are added to `deploy.needs`.

  deploy:
    name: Deploy API
    needs: [core, postgres, images, docker]
    # THROWAWAY: the event condition is true here so only `needs` can stop this job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "THROWAWAY - a real deploy would run now"
