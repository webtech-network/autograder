# One workflow verifies every commit and is the only path that publishes images.
#
# Every job runs Makefile targets only, exactly as contributors do (see
# docs/guides/development.md). The `publish` job needs every verification job,
# so a push to main publishes its images only after all of its verification
# succeeded; a test enforces that new jobs join its `needs`. Nothing deploys,
# and before 1.0.0 nothing is released (docs/github_action/README.md#versions-and-images).
#
# Third-party actions are pinned to release commits (the tag is in the comment).
name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its superseded run; every commit on
  # main gets its own group, so main runs (and their publication) are never cancelled.
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    name: Core path (make verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      - run: make verify

  postgres:
    name: PostgreSQL tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autograder
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: autograder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autograder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://autograder:local-test-only@127.0.0.1:5432/autograder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      - run: make test-postgres

  images:
    name: Service and Action images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      # Builds the images from scratch (a fresh runner has no cache) and checks
      # exactly those: contents, context leaks, the Action grading an example.
      - run: make test-images

  docker:
    name: Docker sandboxes (integration and e2e)
    runs-on: ubuntu-latest
    # About 32 minutes with COR-01's attribution, COR-02's lifetime and PRF-03's
    # staging suites, so 30 cancelled passing runs; the per-runtime isolation
    # suites have since moved to the `isolation` job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      - run: make test-integration
      - run: make test-e2e

  isolation:
    name: Sandbox isolation under gVisor and runc
    runs-on: ubuntu-latest
    # About 27 minutes on ubuntu-latest: COR-01's 20 repetitions per runtime dominate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      - run: make gvisor-install
      - run: make test-isolation

  http:
    name: HTTP path (Compose stack from this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      # The stack runs the shipped sandbox_config.yml (runtime: runsc), as a
      # deployment does; the control service refuses to start without it.
      - run: make gvisor-install
      - run: make test-http

  # The packaged Action from this commit, as a consumer's workflow runs it: on a
  # GitHub-hosted runner, `uses: ./` with the quick-start inputs, no setup steps.
  # Each fixture is graded by the real container action and then checked
  # (scripts/action_fixtures.py): outcome and outputs, one sandbox per execution
  # run and none left over, and a probe that sees no credential, runner variable,
  # Docker socket or network.
  action:
    name: Packaged Action on a hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      # Fixture checkouts; action.yml builds Dockerfile.actions from this commit.
      - run: make action-fixtures
      - id: static
        uses: ./
        with:
          definition-path: .action-fixtures/static/definition.json
          submission-root: .action-fixtures/static/submission
          locale: pt-br
      - run: make test-action
        env:
          ACTION_FIXTURE: static
          ACTION_STATUS: ${{ steps.static.outputs.status }}
          ACTION_SCORE: ${{ steps.static.outputs.score }}
          ACTION_RESULT_PATH: ${{ steps.static.outputs.result-path }}
      - id: python_io
        uses: ./
        with:
          definition-path: .action-fixtures/python-io/definition.json
          submission-root: .action-fixtures/python-io/submission
      - run: make test-action
        env:
          ACTION_FIXTURE: python-io
          ACTION_STATUS: ${{ steps.python_io.outputs.status }}
          ACTION_SCORE: ${{ steps.python_io.outputs.score }}
          ACTION_RESULT_PATH: ${{ steps.python_io.outputs.result-path }}
      - id: c_io
        uses: ./
        with:
          definition-path: .action-fixtures/c-io/definition.json
          submission-root: .action-fixtures/c-io/submission
      - run: make test-action
        env:
          ACTION_FIXTURE: c-io
          ACTION_STATUS: ${{ steps.c_io.outputs.status }}
          ACTION_SCORE: ${{ steps.c_io.outputs.score }}
          ACTION_RESULT_PATH: ${{ steps.c_io.outputs.result-path }}
      - id: python_io_wrong
        uses: ./
        with:
          definition-path: .action-fixtures/python-io-wrong/definition.json
          submission-root: .action-fixtures/python-io-wrong/submission
      - run: make test-action
        env:
          ACTION_FIXTURE: python-io-wrong
          ACTION_STATUS: ${{ steps.python_io_wrong.outputs.status }}
          ACTION_SCORE: ${{ steps.python_io_wrong.outputs.score }}
          ACTION_RESULT_PATH: ${{ steps.python_io_wrong.outputs.result-path }}
      - id: probe
        uses: ./
        with:
          definition-path: .action-fixtures/probe/definition.json
          submission-root: .action-fixtures/probe/submission
          autograder-cloud-token: ENV03-SENTINEL-CLOUD-TOKEN
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ENV03-SENTINEL-OPENAI-KEY
      - run: make test-action
        env:
          ACTION_FIXTURE: probe
          ACTION_STATUS: ${{ steps.probe.outputs.status }}
          ACTION_SCORE: ${{ steps.probe.outputs.score }}
          ACTION_RESULT_PATH: ${{ steps.probe.outputs.result-path }}
          REAL_GITHUB_TOKEN: ${{ github.token }}

  # Every verified push to main publishes the images it verified: the runtime
  # images sandbox_config.yml pins (each reference once), and the API, sandbox
  # manager and Action images as sha-<commit> and main, the tag action.yml runs.
  # It rebuilds and checks them from this commit first, exactly as the `images`
  # job did, and publishes nothing unless this commit is still the head of main:
  # an older commit whose verification finished last must not move `main` back
  # (scripts/publish_images.py). Packages are made public once by an
  # organization admin; until then this job warns.
  publish:
    name: Publish images from main
    needs: [core, postgres, images, docker, isolation, http, action]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .tool-versions
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.15"
          enable-cache: true
      # uv sync --locked fails when pyproject.toml and uv.lock disagree.
      - run: make install
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make test-images
      - run: make sandbox-build-all
      - run: make publish-images
