name: Feature proposal
description: Propose a new feature with scope, rationale, and acceptance criteria.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for new features and product capabilities.
        Keep details concise; add only what helps implementation.

  - type: textarea
    id: summary
    attributes:
      label: Feature overview
      description: What is the feature?
      placeholder: Describe the feature in a few lines.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem this solves (optional)
      description: What pain point or opportunity does this address?

  - type: textarea
    id: scope
    attributes:
      label: Scope (optional)
      description: Boundaries or phases if already known.
      placeholder: |
        Phase 1:
        - ...

        Phase 2:
        - ...

  - type: textarea
    id: architecture
    attributes:
      label: Implementation notes (optional)
      description: Expected implementation direction, data model, or integration notes.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria (optional)
      description: Use checklist format whenever possible.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Related issues/PRs/docs/specs.
      placeholder: |
        - Parent issue:
        - Depends on:
        - Spec doc:
