name: Implementation task
description: Track a concrete execution task (performance, security, refactor, docs, etc.).
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Use this for focused execution issues, including work derived from umbrella issues.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should this task achieve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal (optional)
      description: Proposed implementation approach.

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria (optional)
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: textarea
    id: references
    attributes:
      label: References and dependencies (optional)
      description: Parent issues, related PRs, or linked backend/frontend tasks.
      placeholder: |
        - Parent umbrella:
        - Related issue:
        - Dependency:
