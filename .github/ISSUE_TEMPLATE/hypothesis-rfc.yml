name: Hypothesis / RFC
description: Capture exploratory proposals and open design questions.
title: "[Hypothesis] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for early-stage ideas that still require validation.

  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: State the proposal as a testable hypothesis.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: What scenario motivated this idea?

  - type: textarea
    id: open_questions
    attributes:
      label: Open questions (optional)
      description: List unresolved decisions that need team input.
      placeholder: |
        - Should we...?
        - What is the impact of...?

  - type: textarea
    id: validation
    attributes:
      label: Validation plan (optional)
      description: How this hypothesis will be evaluated (tests, spikes, metrics).

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Related discussions/issues/PRs/docs.
