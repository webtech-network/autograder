name: Bug report
description: Report a reproducible defect affecting Autograder behavior.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug.
        Keep it short: the goal is to make triage fast.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug.
      placeholder: What is broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the issue.
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. Run/submit ...
        4. Observe ...

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happened?

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Related issues/PRs/logs/screenshots.
      placeholder: |
        - Related: #123
        - API issue: webtech-network/api-grader-prisma#456
