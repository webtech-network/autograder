name: Bug report
description: Report a reproducible defect with minimal required information.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this bug. Keep it short and focused.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: One short paragraph describing the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional, but helpful for reliable reproduction.
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. Run/submit ...
        4. Observe ...

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What actually happened?

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?

  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Version, branch, runtime, or deployment context if relevant.
      placeholder: |
        - Branch/commit:
        - Runtime:
        - Local/CI/Prod:

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Related issues/PRs/logs/screenshots.
