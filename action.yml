name: "Prisma Autograder"
author: "Arthur Carvalho"
description: "Grade one checkout from a versioned definition and retain a canonical outcome."
inputs:
  execution-mode:
    description: "repo loads definition-path; external fetches a cloud definition."
    required: false
    default: "repo"
  definition-path:
    description: "Canonical v1 definition JSON path, relative to the workspace or absolute. Used in repo mode."
    required: false
    default: ".github/autograder/definition.json"
  submission-root:
    description: "Directory of UTF-8 submission files, relative to the workspace or absolute."
    required: false
    default: "."
  grading-config-id:
    description: "Positive cloud configuration ID. Required for external mode or cloud publication."
    required: false
  autograder-cloud-url:
    description: "Cloud base URL. Required for external mode, cloud publication, or delivery retry."
    required: false
  autograder-cloud-token:
    description: "Cloud authentication secret. Required for external mode, cloud publication, or delivery retry."
    required: false
  upload-to-cloud:
    description: "Explicitly publish the finished outcome to the selected cloud configuration."
    required: false
    default: "false"
  retry-delivery-path:
    description: "Saved delivery.json attestation to publish without grading again. Requires cloud URL and token."
    required: false
  submission-language:
    description: "Allowed language ID. May be omitted only when the definition has one language."
    required: false
  locale:
    description: "Feedback locale: en or pt-br. Applies in both configuration modes."
    required: false
    default: "en"
outputs:
  status:
    description: "Terminal grading status: completed or failed. Written before delivery."
  score:
    description: "Authoritative score in [0,100], present only for completed grading."
  result-path:
    description: "Workspace-relative canonical outcome JSON path, retained even when delivery fails."
  submission-id:
    description: "Cloud submission ID, present only after successful publication."
runs:
  using: docker
  image: "Dockerfile.actions"
  env:
    EXECUTION_MODE: ${{ inputs.execution-mode }}
    DEFINITION_PATH: ${{ inputs.definition-path }}
    SUBMISSION_ROOT: ${{ inputs.submission-root }}
    GRADING_CONFIG_ID: ${{ inputs.grading-config-id }}
    AUTOGRADER_CLOUD_URL: ${{ inputs.autograder-cloud-url }}
    AUTOGRADER_CLOUD_TOKEN: ${{ inputs.autograder-cloud-token }}
    UPLOAD_TO_CLOUD: ${{ inputs.upload-to-cloud }}
    RETRY_DELIVERY_PATH: ${{ inputs.retry-delivery-path }}
    SUBMISSION_LANGUAGE: ${{ inputs.submission-language }}
    LOCALE: ${{ inputs.locale }}
