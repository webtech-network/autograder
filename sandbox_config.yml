general:

    # RUNTIME (required): the OCI runtime every sandbox runs under, chosen here once.
    #   runsc  gVisor; the host refuses to start when Docker does not offer it.
    #   runc   accepted without gVisor: submissions share the host kernel.
    # A host never switches runtime by itself: a failed gVisor start fails that one
    # acquisition (retryable). Per-environment expectations: docs/contracts/SANDBOX.md.
    runtime: runsc

    # MAX SANDBOXES (N): the host-wide sandbox budget, shared by every language,
    # by grading and by deliberate execution (POST /execute).
    # Sandboxes being created, in use, being removed or quarantined never exceed N.
    # An acquisition beyond N waits for a slot instead of failing: grading waits up
    # to 10 minutes (then a retryable failure, never a score), deliberate execution
    # 10 seconds (then 503 EXECUTION_BUSY).
    # Sizing: N is bounded by CPU, not by the number of API workers. Each sandbox
    # may use 0.5 CPU and 128 MiB; gVisor and the API need the rest. Start near
    # 2/3 of the logical CPUs (about 8 on 12 CPUs) and raise it only while the
    # benchmark's throughput still rises. See docs/contracts/JOBS.md.
    max_sandboxes: 8

    # POOL SIZE: warm idle containers kept per language, outside the budget.
    # Taking a warm container still takes a budget slot. Must not exceed max_sandboxes.
    pool_size: 1

    # RUNNING TIMEOUT: maximum seconds a handed-out sandbox may live, counted from
    # the moment it was granted (time spent waiting for a slot does not count).
    running_timeout: 120

# RUNTIMES: the host's runtime profiles, mapping a domain language identifier to the
# sandbox image this host runs for it. Replacing an image changes only this map.
# A language left out has no pool: grading or deliberate execution in that language
# fails as an unavailable capability (never as an invalid language).
# These are the versioned images built from sandbox_manager/images (see
# `python scripts/sandbox_images.py list`). Images are never pulled implicitly: run
# `docker pull <image>` (or `make sandbox-build-all`) first; a missing image, or one
# whose autograder.runtime.languages label omits the language, stops the host at startup.
runtimes:
    python: ghcr.io/webtech-network/autograder-sandbox-python:c7739d3b1863
    java: ghcr.io/webtech-network/autograder-sandbox-java:e6a8ea1c4e0c
    node: ghcr.io/webtech-network/autograder-sandbox-node:4a0dc30f9c4d
    cpp: ghcr.io/webtech-network/autograder-sandbox-cpp:bcbf4bab3f24
    c: ghcr.io/webtech-network/autograder-sandbox-cpp:bcbf4bab3f24
